state_dir: data

models:
  codex:
    command:
      - codex
      - exec
      - --ephemeral
      - --skip-git-repo-check
      - --ignore-user-config
      - --ignore-rules
      - --strict-config
      - --disable
      - apps
      - --disable
      - image_generation
      - --model
      - gpt-5.6-sol
      - -c
      - 'model_reasoning_effort="xhigh"'
      - --sandbox
      - read-only
      - -c
      - features.shell_tool=false
      - -c
      - agents.enabled=false
      - -c
      - 'web_search="disabled"'
      - '-'
    timeout: 600
    env: [PATH, HOME, CODEX_HOME]

  codex-luna:
    command:
      - codex
      - exec
      - --ephemeral
      - --skip-git-repo-check
      - --ignore-user-config
      - --ignore-rules
      - --strict-config
      - --disable
      - apps
      - --disable
      - image_generation
      - --model
      - gpt-5.6-luna
      - -c
      - 'model_reasoning_effort="low"'
      - --sandbox
      - read-only
      - -c
      - features.shell_tool=false
      - -c
      - agents.enabled=false
      - -c
      - 'web_search="disabled"'
      - '-'
    timeout: 600
    env: [PATH, HOME, CODEX_HOME]

  codex-web:
    command:
      - codex
      - exec
      - --ephemeral
      - --skip-git-repo-check
      - --ignore-user-config
      - --ignore-rules
      - --strict-config
      - --disable
      - apps
      - --disable
      - image_generation
      - --model
      - gpt-5.6-sol
      - -c
      - 'model_reasoning_effort="xhigh"'
      - --sandbox
      - read-only
      - -c
      - features.shell_tool=false
      - -c
      - agents.enabled=false
      - -c
      - 'web_search="live"'
      - '-'
    timeout: 1800
    env: [PATH, HOME, CODEX_HOME]

  kimi:
    command:
      - kimi
      - --output-format
      - stream-json
      - --agent-file
      - prompts/kimi.md
      - -p
      - '{prompt}'
    timeout: 600
    env: [PATH, HOME, KIMI_CODE_HOME]
    output: jsonl

  kimi-web:
    command:
      - kimi
      - --output-format
      - stream-json
      - --agent-file
      - prompts/kimi-web.md
      - -p
      - '{prompt}'
    timeout: 600
    env: [PATH, HOME, KIMI_CODE_HOME]
    output: jsonl

agents:
  reader:
    model: codex-luna
    prompt: prompts/reader.md
  curator:
    model: codex
    prompt: prompts/curator.md
  writer:
    model: codex-web
    prompt: prompts/writer.md
  # Optional: a stronger model for the final citation check. Defaults to the reader.
  # checker:
  #   model: codex
  #   prompt: prompts/checker.md
jobs:
  rss:
    module: cron_agents.jobs.rss
    limit_per_feed: 20
    # Seconds between two requests to the same host. Reddit needs about 20.
    host_interval_seconds: 20
    feeds:
      - name: codex-releases
        url: https://github.com/openai/codex/releases.atom
      - name: claude-code-releases
        url: https://github.com/anthropics/claude-code/releases.atom
      - name: kimi-cli-releases
        url: https://github.com/MoonshotAI/Kimi-CLI/releases.atom
      - name: llama-cpp-releases
        url: https://github.com/ggml-org/llama.cpp/releases.atom
      # Add YouTube channel feeds here. Reuse this name so YouTube stays one
      # provider when briefing candidates rotate across sources.
      # - name: youtube
      #   url: https://www.youtube.com/feeds/videos.xml?channel_id=CHANNEL_ID

  arxiv:
    module: cron_agents.jobs.rss
    limit_per_feed: 40
    feeds:
      - name: arxiv
        url: https://export.arxiv.org/api/query?search_query=cat%3Acs.AI%20OR%20cat%3Acs.CL%20OR%20cat%3Acs.LG%20OR%20cat%3Acs.MA%20OR%20cat%3Acs.SE&start=0&max_results=40&sortBy=submittedDate&sortOrder=descending

  papers:
    module: cron_agents.jobs.papers

  hn:
    module: cron_agents.jobs.hn
    limit: 10
    reader_url: https://r.jina.ai/

  # Trending Hugging Face models and Spaces, and one author's latest models.
  # Uncomment and add `huggingface` to your schedule and jobs list to collect it.
  # huggingface:
  #   module: cron_agents.jobs.huggingface
  #   limit_per_query: 20
  #   queries:
  #     - name: trending-models
  #       kind: models
  #       params: {sort: trendingScore, direction: -1}
  #     - name: trending-spaces
  #       kind: spaces
  #       params: {sort: trendingScore, direction: -1}
  #     - name: unsloth
  #       kind: models
  #       params: {author: unsloth, sort: lastModified, direction: -1}

  briefing:
    module: cron_agents.jobs.briefing
    reader: reader
    # checker: checker
    curator: curator
    writer: writer
    context: |
      Audience: a technically capable generalist who builds with AI and may be new to each source's field.
      Goal: turn today's strongest relevant stories into a daily briefing that
      teaches the useful part of each one and sparks things worth making or testing.
      Prefer surprising tools, visible results, clear mechanisms, open projects, and
      experiments the reader can reproduce. Treat links to current work as weak
      context; they do not create interest on their own. Skip routine releases,
      generic business news, routine security incidents, and package compromises
      unless they reveal a broader mechanism or experiment worth trying.
      Prefer evidence over announcements: a specific result, meaningful comparison,
      visible change, surprising failure, or explanation worth passing on. A popular
      headline or small benchmark improvement is not enough. If a discovery could
      inspire content, ask why a stranger would care and what real evidence supports
      the premise. Do not force a video angle onto every useful thing to learn.
      Assume the reader knows common AI and software terms. Use plain technical
      English. Learning comes first. Useful projects and content can follow. Include
      every strong match, preserve useful variety, and skip filler.
    lookback_hours: 36
    candidate_limit: 1000
    min_sources: 1
    max_content_chars: 5000
    output_dir: briefings
