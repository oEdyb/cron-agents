state_dir: data

models:
  codex:
    command:
      - codex
      - exec
      - --ephemeral
      - --skip-git-repo-check
      - --ignore-user-config
      - --ignore-rules
      - --strict-config
      - --model
      - gpt-5.6-sol
      - -c
      - 'model_reasoning_effort="xhigh"'
      - --sandbox
      - read-only
      - -c
      - features.shell_tool=false
      - -c
      - agents.enabled=false
      - -c
      - 'web_search="disabled"'
      - '-'
    timeout: 600
    env: [PATH, HOME, CODEX_HOME]

  codex-web:
    command:
      - codex
      - exec
      - --ephemeral
      - --skip-git-repo-check
      - --ignore-user-config
      - --ignore-rules
      - --strict-config
      - --model
      - gpt-5.6-sol
      - -c
      - 'model_reasoning_effort="xhigh"'
      - --sandbox
      - read-only
      - -c
      - features.shell_tool=false
      - -c
      - agents.enabled=false
      - -c
      - 'web_search="live"'
      - '-'
    timeout: 600
    env: [PATH, HOME, CODEX_HOME]

  kimi:
    command:
      - kimi
      - --output-format
      - stream-json
      - --agent-file
      - prompts/kimi.md
      - -p
      - '{prompt}'
    timeout: 600
    env: [PATH, HOME, KIMI_CODE_HOME, KIMI_CODE_EXPERIMENTAL_FLAG]
    output: jsonl

  kimi-web:
    command:
      - kimi
      - --output-format
      - stream-json
      - --agent-file
      - prompts/kimi-web.md
      - -p
      - '{prompt}'
    timeout: 600
    env: [PATH, HOME, KIMI_CODE_HOME, KIMI_CODE_EXPERIMENTAL_FLAG]
    output: jsonl

agents:
  curator:
    model: codex
    prompt: prompts/curator.md
  writer:
    model: codex-web
    prompt: prompts/writer.md

jobs:
  rss:
    module: cron_agents.jobs.rss
    limit_per_feed: 20
    feeds:
      - name: codex-releases
        url: https://github.com/openai/codex/releases.atom
      - name: claude-code-releases
        url: https://github.com/anthropics/claude-code/releases.atom
      - name: kimi-cli-releases
        url: https://github.com/MoonshotAI/Kimi-CLI/releases.atom
      - name: llama-cpp-releases
        url: https://github.com/ggml-org/llama.cpp/releases.atom
      # Add YouTube channel feeds here. Reuse this name so YouTube stays one
      # provider when briefing candidates rotate across sources.
      # - name: youtube
      #   url: https://www.youtube.com/feeds/videos.xml?channel_id=CHANNEL_ID

  arxiv:
    module: cron_agents.jobs.rss
    limit_per_feed: 40
    feeds:
      - name: arxiv
        url: https://export.arxiv.org/api/query?search_query=cat%3Acs.AI%20OR%20cat%3Acs.CL%20OR%20cat%3Acs.LG%20OR%20cat%3Acs.MA%20OR%20cat%3Acs.SE&start=0&max_results=40&sortBy=submittedDate&sortOrder=descending

  papers:
    module: cron_agents.jobs.papers

  hn:
    module: cron_agents.jobs.hn
    limit: 10
    reader_url: https://r.jina.ai/

  briefing:
    module: cron_agents.jobs.briefing
    curator: curator
    writer: writer
    context: |
      Audience: a developer who builds with AI.
      Goal: teach the reader something useful in a short daily lesson.
      Prefer surprising tools, visible results, clear mechanisms, open projects, and
      experiments the reader can reproduce. Treat links to current work as weak
      context; they do not create interest on their own. Skip routine releases,
      generic business news, and incidents without a direct practical consequence.
      Assume the reader knows common AI and software terms. Explain uncommon ideas
      with plain words and one concrete example. Focus on the few ideas that make
      the rest click. Prefer ideas the reader can test and learn by doing. Learning
      comes first; a useful project or content idea can follow. Include every strong
      match and skip filler.
    lookback_hours: 36
    candidate_limit: 1000
    min_sources: 1
    max_sources: 10
    max_content_chars: 5000
    output_dir: briefings
